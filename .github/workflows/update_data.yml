name: Update Trump Data (Final API)
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  pull_request:

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Dependencies
        run: pip install requests
      - name: Validate counter logic
        run: python -m unittest discover -s tests -v
      - name: Read Factbase social activity
        run: python analyzer.py ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}
      - name: Commit and Push
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified Factbase social counts"
            git push
          else
            echo "No data changes"
          fi
