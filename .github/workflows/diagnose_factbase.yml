name: Diagnose Roll Call Factbase (non-production)
on:
  push:
    branches:
      - diagnostics/factbase-html-and-browser-20261120
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install diagnostic dependencies
        run: |
          python -m pip install requests beautifulsoup4
      - name: Diagnose Roll Call page (no content persisted)
        run: python factbase_diagnostic.py
